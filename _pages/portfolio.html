---
layout: collection-page
title: "Portfolio"
permalink: /portfolio/
---

{% include base_path %}

<div class="portfolio-page">
{% assign sorted_portfolio = site.portfolio | sort: 'date' | reverse %}
{% for post in sorted_portfolio %}
  <div class="portfolio-item">
    <h3>{{ post.title }}</h3>
    {% if post.excerpt %}
      <p>{{ post.excerpt }}</p>
    {% endif %}
  </div>
{% endfor %}
</div>
